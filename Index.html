<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0; font-family:'Poppins', sans-serif; background:#fff8f0; color:#4a2c0a; text-align:center; overflow-x:hidden;}
  .hero{height:100vh; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1080') center/cover; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white;}
  .hero h1{font-family:'Great Vibes', cursive; font-size:70px; margin:0; animation: fadeIn 2s;}
  .hero p{font-size:20px; letter-spacing:3px; margin-top:10px;}
  .card{max-width:700px; margin:-80px auto 40px; background:white; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,0.15); padding:40px 25px; position:relative;}
  .names{font-family:'Great Vibes', cursive; font-size:55px; color:#b76e22; margin:15px 0;}
  .divider{width:80px; height:3px; background:linear-gradient(to right, #b76e22, #f8d7a0); margin:20px auto; border-radius:10px;}
  .details{font-size:18px; line-height:1.8;}
  .details b{color:#b76e22;}
  .btn{display:inline-block; margin-top:25px; padding:14px 30px; background:#b76e22; color:white; text-decoration:none; border-radius:30px; font-weight:600; letter-spacing:1px;}
  .footer{padding:30px; font-size:14px; opacity:0.7;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)}}
